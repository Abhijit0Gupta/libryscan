
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libryscan-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - libryscan-network

  webserver:
    image: nginx:alpine
    container_name: libryscan-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./.docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - libryscan-network

  db:
    image: mysql:8.0
    container_name: libryscan-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: libryscan
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: libryuser
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - libryscan-network

networks:
  libryscan-network:
    driver: bridge

volumes:
  dbdata: